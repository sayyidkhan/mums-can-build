<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Mums Can Build Voice</title>
    <link rel="stylesheet" href="/static/styles.css" />
  </head>
  <body>
    <main class="shell">
      <section class="voice-hero">
        <p class="brand">Mums Can Build</p>
        <div id="voiceOrb" class="voice-orb" aria-hidden="true">
          <span class="orb-core"></span>
          <span class="orb-shine"></span>
          <span class="orb-ring"></span>
        </div>
        <div class="call-state">
          <span class="signal" aria-hidden="true"></span>
          <span id="status">Idle</span>
        </div>
        <p class="hint">Tap start and speak your request</p>
        <button id="startCall" class="call-button" type="button">
          <span class="mic-icon" aria-hidden="true">
            <svg viewBox="0 0 24 24" role="img">
              <path d="M12 14.5a3.5 3.5 0 0 0 3.5-3.5V6a3.5 3.5 0 0 0-7 0v5a3.5 3.5 0 0 0 3.5 3.5Z" />
              <path d="M5.5 10.5v.8a6.5 6.5 0 0 0 13 0v-.8" />
              <path d="M12 17.8V21" />
              <path d="M8.5 21h7" />
            </svg>
          </span>
          <span id="callButtonLabel">Start call</span>
        </button>

        <audio id="remoteAudio" autoplay></audio>
      </section>

      <section class="debug-grid">
        <section class="transcript">
          <div class="panel-header">
            <span class="panel-icon chat-icon" aria-hidden="true"></span>
            <h2>Call transcript</h2>
          </div>
          <div id="transcriptLog" class="log"></div>
        </section>

        <section class="events">
          <div class="panel-header">
            <span class="panel-icon cube-icon" aria-hidden="true"></span>
            <h2>Harness events</h2>
          </div>
          <div id="eventLog" class="log"></div>
        </section>
      </section>
    </main>
    <script src="/static/app.js"></script>
  </body>
</html>
